<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dual Antennas -->
  <rect x="20" y="4" width="2.5" height="26" rx="1.25" fill="#475569"/>
  <rect x="41.5" y="4" width="2.5" height="26" rx="1.25" fill="#475569"/>

  <!-- Wi-Fi wave arches (decorative, glowing blue/white) -->
  <path d="M 16 8 A 20 20 0 0 1 48 8" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 22 13 A 12 12 0 0 1 42 13" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- ONU Main Body (white/silver rounded modern device) -->
  <rect x="10" y="26" width="44" height="28" rx="4" fill="url(#onu-body)" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <!-- Stand/Base -->
  <path d="M16 54 L48 54 L52 58 L12 58 Z" fill="#475569" stroke="#334155" stroke-width="1"/>

  <!-- Front LED Display Panel -->
  <rect x="16" y="32" width="32" height="6" rx="1.5" fill="#0f172a"/>

  <!-- Glowing status indicators (Green) -->
  <!-- Power LED -->
  <circle cx="20" cy="35" r="1.2" fill="#22c55e" filter="url(#glow)"/>
  <!-- PON LED (Fiber connection) -->
  <circle cx="26" cy="35" r="1.2" fill="#22c55e" filter="url(#glow)"/>
  <!-- LAN LED -->
  <circle cx="32" cy="35" r="1.2" fill="#22c55e" filter="url(#glow)"/>
  <!-- Wi-Fi LED -->
  <circle cx="38" cy="35" r="1.2" fill="#22c55e" filter="url(#glow)"/>
  
  <!-- Fiber connector slot on the side/back (yellow cable entering) -->
  <path d="M12 48 C 6 48, 6 64, 0 64" stroke="#eab308" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <defs>
    <linearGradient id="onu-body" x1="32" y1="26" x2="32" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
</svg>