<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer rack chassis shadow/border -->
  <rect x="2" y="16" width="60" height="32" rx="4" fill="url(#olt-chassis-grad)" stroke="#475569" stroke-width="2"/>
  
  <!-- Rack mounting brackets / ears -->
  <rect x="2" y="16" width="4" height="32" rx="1" fill="#64748b"/>
  <rect x="58" y="16" width="4" height="32" rx="1" fill="#64748b"/>
  
  <!-- Mounting holes -->
  <circle cx="4" cy="22" r="1" fill="#1e293b"/>
  <circle cx="4" cy="42" r="1" fill="#1e293b"/>
  <circle cx="60" cy="22" r="1" fill="#1e293b"/>
  <circle cx="60" cy="42" r="1" fill="#1e293b"/>
  
  <!-- Horizontal lines/slots for blade cards -->
  <line x1="8" y1="24" x2="56" y2="24" stroke="#334155" stroke-width="1.5"/>
  <line x1="8" y1="32" x2="56" y2="32" stroke="#334155" stroke-width="1.5"/>
  <line x1="8" y1="40" x2="56" y2="40" stroke="#334155" stroke-width="1.5"/>
  
  <!-- LEDs / Status Lights (glowing green/red/blue) -->
  <circle cx="12" cy="20" r="1.5" fill="#22c55e" filter="url(#glow)"/>
  <circle cx="16" cy="20" r="1.5" fill="#3b82f6" filter="url(#glow)"/>
  <circle cx="20" cy="20" r="1.5" fill="#eab308"/>
  
  <!-- OLT Fiber port connectors -->
  <!-- Port Row 1 -->
  <rect x="26" y="26" width="6" height="4" rx="1" fill="#0284c7"/>
  <rect x="34" y="26" width="6" height="4" rx="1" fill="#0284c7"/>
  <rect x="42" y="26" width="6" height="4" rx="1" fill="#0284c7"/>
  <rect x="50" y="26" width="6" height="4" rx="1" fill="#0f172a" stroke="#334155"/>
  
  <!-- Port Row 2 -->
  <rect x="26" y="34" width="6" height="4" rx="1" fill="#0284c7"/>
  <rect x="34" y="34" width="6" height="4" rx="1" fill="#0f172a" stroke="#334155"/>
  <rect x="42" y="34" width="6" height="4" rx="1" fill="#0284c7"/>
  <rect x="50" y="34" width="6" height="4" rx="1" fill="#0284c7"/>

  <!-- Fiber cable jumpers exiting OLT -->
  <path d="M29 30 C 29 45, 12 45, 12 60" stroke="#facc15" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M37 30 C 37 45, 20 48, 20 60" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Brand label (decorative) -->
  <rect x="10" y="27" width="12" height="2" rx="0.5" fill="#475569"/>

  <defs>
    <linearGradient id="olt-chassis-grad" x1="32" y1="16" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
</svg>