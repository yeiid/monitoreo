<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer rack chassis -->
  <rect x="2" y="18" width="60" height="28" rx="3" fill="url(#odf-chassis-grad)" stroke="#475569" stroke-width="2"/>
  
  <!-- Rack mounting brackets -->
  <rect x="2" y="18" width="4" height="28" fill="#64748b"/>
  <rect x="58" y="18" width="4" height="28" fill="#64748b"/>
  
  <!-- Couplers (Ports) - bright blue (SC/UPC) or green (SC/APC) -->
  <!-- Row 1 -->
  <rect x="10" y="24" width="4" height="6" rx="0.5" fill="#3b82f6" stroke="#1d4ed8" stroke-width="0.5"/>
  <rect x="16" y="24" width="4" height="6" rx="0.5" fill="#3b82f6" stroke="#1d4ed8" stroke-width="0.5"/>
  <rect x="22" y="24" width="4" height="6" rx="0.5" fill="#22c55e" stroke="#15803d" stroke-width="0.5"/>
  <rect x="28" y="24" width="4" height="6" rx="0.5" fill="#22c55e" stroke="#15803d" stroke-width="0.5"/>
  <rect x="34" y="24" width="4" height="6" rx="0.5" fill="#3b82f6" stroke="#1d4ed8" stroke-width="0.5"/>
  <rect x="40" y="24" width="4" height="6" rx="0.5" fill="#3b82f6" stroke="#1d4ed8" stroke-width="0.5"/>
  <rect x="46" y="24" width="4" height="6" rx="0.5" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.5" opacity="0.4"/>
  <rect x="52" y="24" width="4" height="6" rx="0.5" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.5" opacity="0.4"/>

  <!-- Row 2 -->
  <rect x="10" y="34" width="4" height="6" rx="0.5" fill="#3b82f6" stroke="#1d4ed8" stroke-width="0.5"/>
  <rect x="16" y="34" width="4" height="6" rx="0.5" fill="#22c55e" stroke="#15803d" stroke-width="0.5"/>
  <rect x="22" y="34" width="4" height="6" rx="0.5" fill="#3b82f6" stroke="#1d4ed8" stroke-width="0.5"/>
  <rect x="28" y="34" width="4" height="6" rx="0.5" fill="#3b82f6" stroke="#1d4ed8" stroke-width="0.5"/>
  <rect x="34" y="34" width="4" height="6" rx="0.5" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.5" opacity="0.4"/>
  <rect x="40" y="34" width="4" height="6" rx="0.5" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.5" opacity="0.4"/>
  <rect x="46" y="34" width="4" height="6" rx="0.5" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.5" opacity="0.4"/>
  <rect x="52" y="34" width="4" height="6" rx="0.5" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.5" opacity="0.4"/>

  <!-- Fiber jumpers connecting to couplers -->
  <path d="M12 27 C 12 10, -5 45, 12 58" stroke="#facc15" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M18 27 C 18 12, 0 48, 18 58" stroke="#facc15" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M24 27 C 24 15, 5 50, 24 58" stroke="#eab308" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M30 37 C 30 50, 45 45, 45 58" stroke="#3b82f6" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.9"/>

  <defs>
    <linearGradient id="odf-chassis-grad" x1="32" y1="18" x2="32" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
</svg>