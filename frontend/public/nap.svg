<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Pole mounting plate on back -->
  <rect x="28" y="4" width="8" height="56" rx="2" fill="#64748b"/>
  <rect x="24" y="12" width="16" height="3" fill="#475569"/>
  <rect x="24" y="48" width="16" height="3" fill="#475569"/>

  <!-- NAP Box Main body (Gray box) -->
  <rect x="12" y="10" width="40" height="44" rx="4" fill="url(#nap-box-grad)" stroke="#94a3b8" stroke-width="2"/>

  <!-- Lock/Latch mechanism on side -->
  <rect x="50" y="28" width="3" height="8" rx="1" fill="#475569"/>

  <!-- Internal splitter and distribution tray area (inset box) -->
  <rect x="18" y="16" width="28" height="32" rx="2" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <!-- Splitter Module (orange 1x8 block) -->
  <rect x="22" y="20" width="20" height="6" rx="1" fill="#f97316"/>
  <circle cx="26" cy="23" r="1" fill="#ffffff"/>
  <text x="30" y="25" fill="#ffffff" font-family="sans-serif" font-size="4" font-weight="bold">1:8</text>

  <!-- Fiber ports inside NAP (SC/APC green couplers) -->
  <rect x="22" y="30" width="3" height="5" rx="0.5" fill="#22c55e"/>
  <rect x="27" y="30" width="3" height="5" rx="0.5" fill="#22c55e"/>
  <rect x="32" y="30" width="3" height="5" rx="0.5" fill="#22c55e"/>
  <rect x="37" y="30" width="3" height="5" rx="0.5" fill="#22c55e"/>
  
  <rect x="22" y="38" width="3" height="5" rx="0.5" fill="#22c55e"/>
  <rect x="27" y="38" width="3" height="5" rx="0.5" fill="#22c55e"/>
  <rect x="32" y="38" width="3" height="5" rx="0.5" fill="#3b82f6"/> <!-- SC/UPC blue coupler -->
  <rect x="37" y="38" width="3" height="5" rx="0.5" fill="#e2e8f0" opacity="0.3"/> <!-- Empty slot -->

  <!-- Cables exiting from the bottom rubber seals -->
  <!-- Feeder black cable -->
  <path d="M25 54 L 25 64" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  <!-- Thin drop/client cables exiting -->
  <path d="M35 54 C 35 58, 42 60, 42 64" stroke="#22c55e" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M38 54 C 38 58, 48 59, 52 64" stroke="#22c55e" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Status indicator LED on the box cover -->
  <circle cx="16" cy="14" r="1.5" fill="#22c55e" filter="url(#glow)"/>

  <defs>
    <linearGradient id="nap-box-grad" x1="32" y1="10" x2="32" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
</svg>