<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Cable entries/glands (left & right sides) -->
  <rect x="2" y="28" width="8" height="8" rx="1" fill="#334155" stroke="#1e293b"/>
  <rect x="54" y="28" width="8" height="8" rx="1" fill="#334155" stroke="#1e293b"/>

  <!-- Entering thick black fiber cables -->
  <path d="M0 32 L 6 32" stroke="#0f172a" stroke-width="4"/>
  <path d="M58 32 L 64 32" stroke="#0f172a" stroke-width="4"/>

  <!-- Mufla Cylindrical Body -->
  <rect x="8" y="16" width="48" height="32" rx="6" fill="url(#mufla-body)" stroke="#0f172a" stroke-width="2"/>

  <!-- Ribbed rings/reinforcements for rugged structure -->
  <rect x="14" y="16" width="3" height="32" fill="#0f172a" opacity="0.3"/>
  <rect x="22" y="16" width="3" height="32" fill="#0f172a" opacity="0.3"/>
  <rect x="30" y="16" width="4" height="32" fill="#475569" stroke="#334155" stroke-width="0.5"/> <!-- Center clamp -->
  <rect x="39" y="16" width="3" height="32" fill="#0f172a" opacity="0.3"/>
  <rect x="47" y="16" width="3" height="32" fill="#0f172a" opacity="0.3"/>

  <!-- Mounting bracket on top -->
  <path d="M20 16 C 20 10, 44 10, 44 16" stroke="#64748b" stroke-width="2.5" fill="none"/>
  
  <!-- Screws / details on Center clamp -->
  <circle cx="32" cy="22" r="1.5" fill="#94a3b8"/>
  <circle cx="32" cy="42" r="1.5" fill="#94a3b8"/>

  <!-- Warning sticker / label -->
  <rect x="12" y="32" width="6" height="4" rx="0.5" fill="#facc15"/>
  <path d="M15 33 L 13.5 35.5 L 16.5 35.5 Z" fill="#000000"/>

  <defs>
    <linearGradient id="mufla-body" x1="32" y1="16" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="25%" stop-color="#1e293b"/>
      <stop offset="75%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
</svg>